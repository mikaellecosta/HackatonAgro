{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | COLHEITA DE DADOS</title>
    <!-- Certifique-se de carregar o Tailwind no seu projeto -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<section id="login" class="min-h-screen flex items-center justify-center relative overflow-hidden py-20" style="background: linear-gradient(135deg, #923C27 0%, #E8D1A7 50%, #743014 100%);">
    
    <!-- Elementos de fundo -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute top-20 left-10 w-64 h-64 bg-[#E8D1A7] rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-[#923C27] rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 max-w-md w-full mx-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <style>
            .imagem-area{
            margin-bottom:10px;
            }

            .imagem-area img{
            width:150px;
            filter:drop-shadow(0 10px 20px rgba(0,0,0,0.15));
            transition:0.3s ease;
            }

            .imagem-area img:hover{
            transform:scale(1.03);
            }
            </style>
            <!-- Logo e título -->
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div class="imagem-area">
                        <img src="{% static 'img/logo.png' %}" /></div>
                </div>
                <h2 class="text-[#743014] mb-2 text-2xl font-bold">Bem-vindo!</h2>
                <p class="text-[#743014] mb-2 text-2xl font-bold" >Grupo Colheita de Dados</p>
            </div>

            <!-- INÍCIO DO FORMULÁRIO DO DJANGO -->
            <form method="POST" action="{% url 'core:login' %}" class="space-y-5">
                {% csrf_token %}

                <!-- Bloco de Erros -->
                {% if form.errors %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                    <span class="block sm:inline">Usuário ou senha incorretos. Tente novamente.</span>
                </div>
                {% endif %}

                <!-- Campo de Usuário (O Django padrão usa 'username', não email) -->
                <div>
                    <label for="id_username" class="block text-[#442D1C] mb-2 font-medium">Usuário</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#923C27]"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <input 
                            type="text" 
                            name="username" 
                            id="id_username"
                            required
                            class="w-full pl-10 pr-4 py-3 border-2 border-[#E8D1A7] rounded-lg focus:outline-none focus:border-[#750A0A] bg-white transition-colors" 
                            placeholder="Digite seu usuário"
                        />
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div>
                    <label for="id_password" class="block text-[#442D1C] mb-2 font-medium">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#923C27]"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input 
                            type="password" 
                            name="password" 
                            id="id_password"
                            required
                            class="w-full pl-10 pr-4 py-3 border-2 border-[#E8D1A7] rounded-lg focus:outline-none focus:border-[#750A0A] bg-white transition-colors" 
                            placeholder="••••••••"
                        />
                    </div>
                </div>

                <!-- Lembrar-me e Esqueceu a senha -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-[#750A0A] border-[#E8D1A7] rounded focus:ring-[#750A0A]" />
                        <span class="ml-2 text-sm text-[#442D1C]">Lembrar-me</span>
                    </label>
                    <a href="#" class="text-sm text-[#750A0A] hover:text-[#923C27] transition-colors font-medium">
                        Esqueceu a senha?
                    </a>
                </div>

                <!-- Redirecionamento Pós-Login -->
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% else %}
                    <!-- Sem parâmetro next, manda para o dashboard -->
                    <input type="hidden" name="next" value="{% url 'core:painel' %}">
                {% endif %}

                <!-- Botão de Submit -->
                <button type="submit" class="w-full bg-[#750A0A] text-[#E8D1A7] py-3 rounded-lg hover:bg-[#8A0B0B] transition-colors flex items-center justify-center gap-2 shadow-lg font-bold">
                    Entrar
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </form>
            
            <!-- Voltar ao site -->
            <div class="mt-8 text-center">
                <a href="{% url 'core:home' %}" class="text-sm text-[#923C27] hover:text-[#750A0A] transition-colors font-medium">
                    &larr; Voltar ao site
                </a>
            </div>

        </div>
    </div>
</section>

</body>
</html>
